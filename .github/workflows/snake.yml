name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ademaru-monc
          outputs: |
            dist/snake.svg?color_snake=#E03131&color_dots=#161b22,#3a1515,#5c1f1f,#8a2a2a,#E03131
            dist/snake-dark.svg?palette=github-dark&color_snake=#E03131&color_dots=#0d1117,#2a1212,#4a1c1c,#7a2828,#E03131
            dist/snake-light.svg?color_snake=#E03131&color_dots=#ebedf0,#f5c6c6,#f0a0a0,#e87a7a,#E03131

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
