name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ademaru-monc
          outputs: |
            dist/snake.svg?color_snake=#FF2A2A&color_dots=#0D1117,#1A0A0A,#3D1010,#8B1A1A,#FF2A2A
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF2A2A&color_dots=#0D1117,#1A0A0A,#3D1010,#8B1A1A,#FF2A2A
            dist/snake-light.svg?color_snake=#FF2A2A&color_dots=#F0F0F0,#E8C8C8,#D08080,#C04040,#FF2A2A

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          commit_message: "Update snake animation"
